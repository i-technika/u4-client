name: Milestone Full Multi-Platform CI

# main 대상 마일스톤 PR이 Ready일 때 돈다 (Draft 동안은 건너뛴다).
# main ruleset의 필수 상태 검사 이름은 아래 job name과 같아야 한다.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: milestone-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      # 설정 파일을 스키마로 검증한다 (#4). 내용은 tool/validate_config.sh 참고.
      # 앞 단계가 실패해도 결과를 함께 보도록 마지막에 두고 항상 실행한다.
      - name: Setup Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate config JSON against schema
        if: ${{ !cancelled() }}
        run: |
          python -m pip install -r tool/requirements-ci.txt
          bash tool/validate_config.sh

  build-android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flavor마다 설정 파일·앱 ID가 다르므로 셋 다 빌드한다.
      - name: Build Android APK (Release, all flavors)
        id: build-apk
        run: |
          flutter build apk --release --flavor dev
          flutter build apk --release --flavor stg
          flutter build apk --release --flavor prod

      # release APK의 최종 권한을 flavor마다 검사한다 (#36). AAB는 아직 검사하지 않는다.
      - name: Check Android permissions in APKs
        run: |
          bash tool/check_android_permissions.sh \
            build/app/outputs/flutter-apk/app-dev-release.apk \
            build/app/outputs/flutter-apk/app-stg-release.apk \
            build/app/outputs/flutter-apk/app-prod-release.apk

      # 런처 이름(aapt2 badging)이 flavor별 설정 JSON의 app.name과 같은지 본다 (#39).
      # 권한 검사가 실패해도 결과를 함께 보도록 빌드만 성공하면 실행한다.
      - name: Check Android launcher labels in APKs
        if: ${{ !cancelled() && steps.build-apk.outcome == 'success' }}
        run: |
          bash tool/check_android_app_label.sh \
            build/app/outputs/flutter-apk/app-dev-release.apk \
            build/app/outputs/flutter-apk/app-stg-release.apk \
            build/app/outputs/flutter-apk/app-prod-release.apk

  build-ios:
    name: iOS Build (No CodeSign)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # 9개 configuration·3개 scheme에서 Xcode가 실제로 적용하는 bundle ID·앱 이름을 확인한다 (#38).
      # 빌드는 오래 걸리므로 하지 않고 xcodebuild -showBuildSettings로 본다.
      - name: Check iOS flavor build settings
        run: bash tool/check_ios_flavors.sh

      # iOS도 scheme(dev/stg/prod)으로 flavor를 고른다 (#38, docs/phase-1-setup.md 2장).
      # flavor별 값은 위 단계가 확인하므로 실제 빌드는 prod만 한다.
      - name: Build iOS (No CodeSign, prod)
        if: ${{ !cancelled() }}
        run: flutter build ios --release --no-codesign --flavor prod
