name: Milestone Full Multi-Platform CI

# main 대상 마일스톤 PR이 Ready일 때 돈다 (Draft 동안은 건너뛴다).
# main ruleset의 필수 상태 검사 이름은 아래 job name과 같아야 한다.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: milestone-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Sub-issue Linux CI와 같은 설정 스키마 검증 (#4)
      - name: Validate config JSON against schema
        env:
          CHECK_JSONSCHEMA: check-jsonschema==0.38.2
        run: |
          pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema \
            --check-metaschema config/app_config.schema.json
          pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema \
            --schemafile config/app_config.schema.json \
            config/app_config.dev.json config/app_config.stg.json config/app_config.prod.json

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

  build-android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flavor마다 설정 파일·앱 ID가 다르므로 셋 다 빌드한다.
      - name: Build Android APK (Release, all flavors)
        run: |
          flutter build apk --release --flavor dev
          flutter build apk --release --flavor stg
          flutter build apk --release --flavor prod

  build-ios:
    name: iOS Build (No CodeSign)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # iOS는 Xcode flavor가 아직 없어 dart-define으로 고른다 (docs/phase-1-setup.md 2장).
      - name: Build iOS (No CodeSign, prod)
        run: flutter build ios --release --no-codesign --dart-define=FLAVOR=prod
