name: Milestone Full Multi-Platform CI

# main 대상 마일스톤 PR이 Ready일 때 돈다 (Draft 동안은 건너뛴다).
# main ruleset의 필수 상태 검사 이름은 아래 job name과 같아야 한다.
on:
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: milestone-full-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: Code Quality
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      # 설정 파일을 스키마로 검증한다 (#4). 내용은 tool/validate_config.sh 참고.
      # 앞 단계가 실패해도 결과를 함께 보도록 마지막에 두고 항상 실행한다.
      - name: Setup Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate config JSON against schema
        if: ${{ !cancelled() }}
        run: |
          python -m pip install -r tool/requirements-ci.txt
          bash tool/validate_config.sh

  build-android:
    name: Android Build (APK)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # flavor마다 설정 파일·앱 ID가 다르므로 셋 다 빌드한다.
      - name: Build Android APK (Release, all flavors)
        run: |
          flutter build apk --release --flavor dev
          flutter build apk --release --flavor stg
          flutter build apk --release --flavor prod

  build-ios:
    name: iOS Build (No CodeSign)
    runs-on: macos-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # iOS도 scheme(dev/stg/prod)으로 flavor를 고른다 (#38, docs/phase-1-setup.md 2장).
      # flavor별 xcconfig·scheme 구성은 test/app_display_name_test.dart가 검사하므로 prod만 빌드한다.
      - name: Build iOS (No CodeSign, prod)
        run: flutter build ios --release --no-codesign --flavor prod
