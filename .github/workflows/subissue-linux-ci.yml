name: Sub-issue Linux CI

# 마일스톤 브랜치(milestone/m<N>) 등 main이 아닌 브랜치를 대상으로 한 PR에서 돈다.
# main 대상 PR은 Milestone Full Multi-Platform CI가 맡는다.
on:
  pull_request:
    branches-ignore:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: subissue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ci:
    name: Linux Analyze, Test & Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # 설정 파일을 스키마로 검증한다 (모르는 키, 범위·형식 제약, prod 제약 — #4).
      # 앱 로더는 모르는 키·enum·타입·prod 제약만 다시 검사하므로 나머지는 여기서 막는다.
      # glob(app_config.*.json)은 스키마 파일까지 잡으므로 flavor 파일을 직접 나열한다.
      - name: Validate config JSON against schema
        env:
          CHECK_JSONSCHEMA: check-jsonschema==0.38.2
        run: |
          pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema \
            --check-metaschema config/app_config.schema.json
          pipx run --spec "$CHECK_JSONSCHEMA" check-jsonschema \
            --schemafile config/app_config.schema.json \
            config/app_config.dev.json config/app_config.stg.json config/app_config.prod.json

      # Flutter 버전은 .fvmrc 한 곳에서 관리한다.
      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android APK (Debug, dev flavor)
        run: flutter build apk --debug --flavor dev
