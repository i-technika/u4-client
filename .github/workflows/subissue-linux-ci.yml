name: Sub-issue Linux CI

# 마일스톤 브랜치(milestone/m<N>) 등 main이 아닌 브랜치를 대상으로 한 PR에서 돈다.
# main 대상 PR은 Milestone Full Multi-Platform CI가 맡는다.
on:
  pull_request:
    branches-ignore:
      - main
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: subissue-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux-ci:
    name: Linux Analyze, Test & Build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.draft == false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Flutter 버전은 .fvmrc 한 곳에서 관리한다.
      - name: Read Flutter version (.fvmrc)
        id: fvm
        run: echo "version=$(jq -r .flutter .fvmrc)" >> "$GITHUB_OUTPUT"

      - name: Setup Java (Temurin 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          flutter-version: ${{ steps.fvm.outputs.version }}
          cache: true

      - name: Verify Flutter environment
        run: flutter doctor -v

      - name: Install dependencies
        run: flutter pub get

      - name: Analyze Dart code
        run: flutter analyze

      - name: Run unit & widget tests
        run: flutter test

      - name: Build Android APK (Debug, dev flavor)
        id: build-dev
        run: flutter build apk --debug --flavor dev

      # prod도 빌드해 런처 이름을 비교한다 (#39). flavor 분기·파일 매핑 회귀를 서브이슈 단계에서 잡는다.
      # dev와 나눠 두어, prod 빌드만 실패해도 아래 검사가 dev APK 결과는 보여 준다.
      - name: Build Android APK (Debug, prod flavor)
        id: build-prod
        run: flutter build apk --debug --flavor prod

      # 병합된 최종 권한에 미디어·저장소 권한이 없는지 APK로 검사한다 (#36).
      # 플러그인이 새로 넣는 권한은 소스 매니페스트 테스트로 잡을 수 없다. 내용은 스크립트 참고.
      # 아래 두 검사는 dev 빌드만 성공하면 실행한다. prod APK가 없으면 "파일이 없습니다"로 실패한다.
      - name: Check Android permissions in APKs
        if: ${{ !cancelled() && steps.build-dev.outcome == 'success' }}
        run: |
          bash tool/check_android_permissions.sh \
            build/app/outputs/flutter-apk/app-dev-debug.apk \
            build/app/outputs/flutter-apk/app-prod-debug.apk

      # 런처 이름(aapt2 badging)이 flavor별 설정 JSON의 app.name과 같은지 본다 (#39).
      # stg까지 포함한 release APK 비교는 Milestone Full CI가 한다.
      - name: Check Android launcher labels in APKs
        if: ${{ !cancelled() && steps.build-dev.outcome == 'success' }}
        run: |
          bash tool/check_android_app_label.sh \
            build/app/outputs/flutter-apk/app-dev-debug.apk \
            build/app/outputs/flutter-apk/app-prod-debug.apk

      # 설정 파일을 스키마로 검증한다 (#4). 내용은 tool/validate_config.sh 참고.
      # 앞 단계가 실패해도 결과를 함께 보도록 마지막에 두고 항상 실행한다.
      - name: Setup Python
        if: ${{ !cancelled() }}
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Validate config JSON against schema
        if: ${{ !cancelled() }}
        run: |
          python -m pip install -r tool/requirements-ci.txt
          bash tool/validate_config.sh
